name: X86-IPv6-Luci23

on:
  repository_dispatch:
  workflow_dispatch:

  # 定时编译，国际时间 UTC 17:00 = 北京时间次日 01:00
  schedule:
    - cron: '0 17 * * *'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/x86v6-luci23.config
  DIY_P1_SH: diy-part1-luci23.sh
  DIY_P2_SH: diy-part2.sh

  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译固件

    # 老版 LEDE 建议使用 Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:

    # =========================================================
    # 检查服务器性能
    # =========================================================
    - name: 检查服务器性能
      run: |
        echo "=========================================="
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意 CPU 性能！"
        echo "已知 CPU 型号(降序): 7763，8370C，8272CL，8171M，E5-2673"
        echo "=========================================="

        echo "-------------------------- CPU 信息 --------------------------"
        echo "CPU 物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort -u | wc -l)"
        echo "CPU 核心数量: $(nproc)"
        echo "CPU 型号信息:"
        cat /proc/cpuinfo | grep -m1 "model name" || true

        echo
        echo "-------------------------- 内存信息 --------------------------"
        free -h

        echo
        echo "-------------------------- 硬盘信息 --------------------------"
        df -hT

    # =========================================================
    # 最大化构建空间
    # =========================================================
    - name: 最大化构建空间
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 8192
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    # =========================================================
    # 检出当前 Actions 仓库
    # =========================================================
    - name: 检出代码
      uses: actions/checkout@v4

    # =========================================================
    # 初始化编译环境
    # =========================================================
    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e

        echo "=========================================="
        echo "初始化 Ubuntu 编译环境"
        echo "=========================================="

        sudo rm -rf /etc/apt/sources.list.d

        sudo bash -c \
          "curl -fsSL https://raw.githubusercontent.com/sbwml/actions/openwrt-build-setup/sources-24.04.list > /etc/apt/sources.list"

        sudo rm -rf \
          /etc/apt/sources.list.d* \
          /usr/local/lib/android* \
          /etc/docker* \
          /etc/firefox* \
          /etc/mysql* \
          /etc/php* \
          /opt/google* \
          /usr/share/dotnet* \
          /usr/share/google* \
          /usr/share/moby* \
          /usr/share/mysql* \
          /usr/share/php*

        sudo -E apt-get -qq update

        sudo -E apt-get -y purge \
          azure* \
          docker* \
          dotnet* \
          firefox* \
          ghc* \
          google* \
          llvm* \
          mongodb* \
          mysql* \
          php* \
          powershell* \
          snap* \
          gfortran* \
          microsoft-edge-stable || true

        sudo -E apt-get -qq install \
          $(curl -fsSL https://raw.githubusercontent.com/Lai-xi/Actions-Lede_x86/main/run)

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir

        echo
        echo "=========================================="
        echo "系统版本"
        echo "=========================================="
        cat /etc/os-release

        echo
        echo "=========================================="
        echo "工具版本"
        echo "=========================================="
        gcc --version | head -n 1 || true
        g++ --version | head -n 1 || true
        make --version | head -n 1 || true
        python3 --version || true
        git --version || true

    # =========================================================
    # 检查基础命令
    # =========================================================
    - name: 检查编译工具
      run: |
        set -e

        echo "=========================================="
        echo "检查必要工具"
        echo "=========================================="

        for cmd in \
          bash \
          gcc \
          g++ \
          make \
          git \
          curl \
          wget \
          tar \
          find \
          xargs \
          patch \
          diff \
          unzip \
          bzip2 \
          perl \
          rsync \
          file \
          which \
          python3
        do
          if command -v "$cmd" >/dev/null 2>&1; then
            echo "[ OK ] $cmd -> $(command -v "$cmd")"
          else
            echo "[FAIL] $cmd"
            exit 1
          fi
        done

    # =========================================================
    # 克隆 OpenWrt / LEDE 源代码
    # =========================================================
    - name: 克隆源代码
      run: |
        set -e

        echo "磁盘空间:"
        df -hT "$PWD"

        echo
        echo "开始克隆:"
        echo "$REPO_URL"
        echo "分支:"
        echo "$REPO_BRANCH"

        git clone \
          --single-branch \
          --depth=1 \
          --filter=blob:none \
          "$REPO_URL" \
          -b "$REPO_BRANCH" \
          "$GITHUB_WORKSPACE/openwrt"

        echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"

        cd "$GITHUB_WORKSPACE/openwrt"

        echo
        echo "当前源码:"
        git log -1 --oneline

    # =========================================================
    # 生成变量
    # =========================================================
    - name: 生成变量
      run: |
